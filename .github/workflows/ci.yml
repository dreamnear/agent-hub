name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web build + typecheck（先行——server RustEmbed 依赖 web/dist 产物）
        working-directory: web
        run: |
          npm ci
          npm run build
          npx tsc --noEmit

      - name: Rust fmt + clippy + test
        # desktop 壳（tauri）依赖 gtk/webkit 系统库，不属 CI 门禁域（自有发布路径），exclude 之
        run: |
          cargo fmt --check
          cargo clippy --workspace --exclude claude-view-desktop -- -D warnings
          cargo test --workspace --exclude claude-view-desktop