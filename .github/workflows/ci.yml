name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web build + typecheck
        working-directory: web
        run: |
          npm ci
          npm run build
          npx tsc --noEmit

      # clippy/test scope to server: desktop (rfd→glib-sys) needs GTK dev libs on
      # linux and is built/tested on macOS only; server tests need web/dist (rust-embed)
      - name: Rust fmt + clippy + test
        run: |
          cargo fmt --check
          cargo clippy -p server -- -D warnings
          cargo test -p server