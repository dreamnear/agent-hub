name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust fmt + clippy + test
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Web build + typecheck
        working-directory: web
        run: |
          npm ci
          npm run build
          npx tsc --noEmit