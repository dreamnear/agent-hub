name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux/amd64
            asset: claude-view-server-linux-x86_64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            asset: claude-view-server-linux-aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web (embedded frontend)
        working-directory: web
        run: |
          npm ci
          npm run build

      # musl static build in alpine container (same recipe as deploy docs);
      # web/dist already built on the runner, mounted in for rust-embed.
      - name: Build server (musl static)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/app -w /app \
            rust:alpine sh -c "apk add --no-cache musl-dev && cargo build -p server --release --locked && cp target/release/server /app/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web (embedded frontend)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build server (aarch64)
        run: |
          cargo build -p server --release --locked
          cp target/release/server claude-view-server-darwin-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: claude-view-server-darwin-aarch64
          path: claude-view-server-darwin-aarch64

  release:
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
